name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Runs the full unit + integration suite under instrumentation and fails
      # the build if line coverage drops below 80%. Tests require a single
      # thread (shared global state in the chia/clvm validation path).
      - name: Run tests with coverage (gate ≥80% lines)
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 80 -- --test-threads=1

      - name: Check documentation
        run: cargo doc --no-deps --all-features
